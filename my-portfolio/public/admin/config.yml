# Netlify: enable Identity + Git Gateway, then open /admin on your deployed site.
# If your default branch is not `main`, change `branch` below.

backend:
  name: git-gateway
  branch: main

# Paths are from the Git repo root. This site lives in my-portfolio/ (not repo root).
media_folder: my-portfolio/public/uploads
public_folder: /uploads

collections:
  - name: portfolio
    label: Website projects
    files:
      - label: Projects list & filters
        name: website_projects
        file: my-portfolio/src/data/projects-data.json
        format: json
        fields:
          - label: Category filter tabs
            name: projectsNav
            widget: list
            fields:
              - { label: Name, name: name, widget: string }
          - label: Projects
            name: projects
            widget: list
            summary: "{{fields.project}} — {{fields.category}}"
            fields:
              - {
                  label: Slug (optional, for your notes),
                  name: slug,
                  widget: string,
                  required: false,
                }
              - {
                  label: Banner image,
                  name: image,
                  widget: string,
                  hint: "Bundled key (e.g. saBanner) OR /uploads/your-file.webp from Media",
                }
              - {
                  label: Logo image,
                  name: logoimg,
                  widget: string,
                  required: false,
                  hint: "Bundled key OR /uploads/... Leave empty if none.",
                }
              - { label: Logo alt text, name: altlogo, widget: string }
              - { label: Role line, name: role, widget: string }
              - { label: Project title, name: project, widget: string }
              - { label: Intro, name: intro, widget: text }
              - { label: Primary button label, name: buttonw, widget: string }
              - { label: Secondary button label, name: buttonb, widget: string }
              - { label: Text color (e.g. black, white, or empty), name: textclr, widget: string, required: false }
              - { label: Show case-study link (CSS display), name: visiblewht, widget: string, default: "inline-block" }
              - { label: Show site link (CSS display), name: visibleblk, widget: string, default: "inline-block" }
              - {
                  label: Case study path (no leading slash),
                  name: caselink,
                  widget: string,
                  required: false,
                  hint: "e.g. salman-arefin — empty if no case study",
                }
              - { label: Live site URL, name: sitelink, widget: string }
              - {
                  label: Category,
                  name: category,
                  widget: select,
                  options:
                    ["WordPress", "MERN", "JavaScript", "HTML-CSS", "Machine Learning", "Deep Learning", "Artificial Intelligence"],
                }
              - { label: Featured on home, name: featured, widget: boolean, default: false }
