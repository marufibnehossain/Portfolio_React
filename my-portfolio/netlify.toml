[build]
  command = "npm run build"
  publish = "build"

# Decap CMS — only rewrite the admin shell; do not use /admin/* or /admin/config.yml breaks.
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200

# React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
